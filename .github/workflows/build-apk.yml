name: Build and Update APK Package

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required so GitHub Actions can commit and push back to your repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Save and Commit APK to Packages Folder
        run: |
          # Create the packages directory if it doesn't exist
          mkdir -p packages
          
          # Copy the newly built APK into the packages folder
          cp app/build/outputs/apk/debug/app-debug.apk packages/app-debug.apk
          
          # Configure git identity for the automated bot commit
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage, commit, and push the updated APK
          git add packages/app-debug.apk
          git diff --staged --quiet || git commit -m "Auto-update latest debug APK [skip ci]"
          git push
